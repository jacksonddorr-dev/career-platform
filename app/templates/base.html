<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ content.profile.full_name }}{% endblock %} · Career Profile</title>
  <meta name="description" content="{{ content.profile.headline }} — {{ content.profile.summary|truncate(155) }}">
  <link rel="canonical" href="{{ settings.site_url }}{{ request.url.path }}">
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; line-height: 1.55; color: #172033; background: #f7f9fc; }
    body { margin: 0; } header, main, footer { max-width: 960px; margin: auto; padding: 1rem 1.25rem; }
    header { display:flex; justify-content:space-between; align-items:center; gap:1rem; } nav a { margin-left: .75rem; }
    a { color:#1459a6; } .hero { padding: 4rem 1.25rem 2rem; } section { background:white; margin:1rem 0; padding:1.5rem; border-radius:.6rem; box-shadow:0 1px 4px #1223  }
    .muted { color:#526070; } .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:1rem; } li { margin:.45rem 0; }
    :focus-visible { outline:3px solid #f59e0b; outline-offset:3px; }
    @media (max-width:650px) { header { align-items:flex-start; flex-direction:column; } nav a { margin:0 .75rem 0 0; } }
  </style>
</head>
<body>
<header><a href="/" aria-label="Home"><strong>{{ content.profile.full_name }}</strong></a>
<nav aria-label="Primary"><a href="/about">About</a><a href="/experience">Experience</a><a href="/projects">Projects</a><a href="/skills">Skills</a><a href="/education">Education</a><a href="/contact">Contact</a></nav></header>
<main>{% block body %}{% endblock %}</main>
<footer><p><a href="/resume.pdf">Download resume</a> · © {{ content.profile.full_name }}</p></footer>
</body></html>
