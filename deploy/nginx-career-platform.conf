# HTTP: answer Let's Encrypt renewal checks, send everything else to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name jacksoncareer.me;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://jacksoncareer.me$request_uri;
    }
}

# HTTPS: TLS ends here; the app listens on loopback only.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name jacksoncareer.me;

    ssl_certificate /etc/letsencrypt/live/jacksoncareer.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jacksoncareer.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# aws.jacksoncareer.me: the same app under the server's own name, with its own certificate.
server {
    listen 80;
    listen [::]:80;
    server_name aws.jacksoncareer.me;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://aws.jacksoncareer.me$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name aws.jacksoncareer.me;

    ssl_certificate /etc/letsencrypt/live/aws.jacksoncareer.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aws.jacksoncareer.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
